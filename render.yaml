# Render Blueprint: Docker includes Java 17 (fixes "java: command not found" on native shell).
services:
  - type: web
    name: wanderwise-catalog
    runtime: docker
    plan: free
    dockerfilePath: ./docker/Dockerfile.catalog
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: WANDERWISE_BOOKING_BASE_URL
        fromService:
          type: web
          name: wanderwise-booking
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: wanderwise-booking
    runtime: docker
    plan: free
    dockerfilePath: ./docker/Dockerfile.booking
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: WANDERWISE_CATALOG_BASE_URL
        fromService:
          type: web
          name: wanderwise-catalog
          envVarKey: RENDER_EXTERNAL_URL
      - key: APP_BASE_URL
        fromService:
          type: web
          name: wanderwise-booking
          envVarKey: RENDER_EXTERNAL_URL
