<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tour details — WanderWise</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<header class="header" id="site-header"></header>
<main class="container section">
    <div class="breadcrumb"><a href="/">Home</a> / <span id="bc-title">Tour</span></div>
    <div class="steps">
        <span class="step active">1. Details</span>
        <span class="step">2. Reviews</span>
        <span class="step">3. Checkout</span>
        <span class="step">4. Payment</span>
    </div>
    <div id="content"><p class="muted">Loading...</p></div>
</main>
<footer class="footer" id="site-footer"></footer>
<script src="/js/api.js?v=3"></script>
<script src="/js/layout.js?v=3"></script>
<script>
const id = qs('id');
if (!id) location.href = '/';

async function load() {
    const a = await api(`/attractions/${id}`);
    document.title = a.title + ' — WanderWise';
    document.getElementById('bc-title').textContent = a.title;
    document.getElementById('content').innerHTML = `
        <div class="detail-grid">
            <div class="detail-image">
                <img src="${tourImageSrc(a.imageUrl)}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:inherit"
                     onerror="onTourImgError(this)">
            </div>
            <div class="detail-panel">
                <span class="badge" style="display:inline-block;background:#e8f4ff;color:var(--primary);padding:0.3rem 0.7rem;border-radius:6px;font-size:0.8rem;font-weight:600;margin-bottom:0.5rem">${a.type}</span>
                <h1>${escapeHtml(a.title)}</h1>
                <p class="card-meta">${escapeHtml(a.cityName)} · ${escapeHtml(a.categoryName)} · ${a.durationHours} hours</p>
                <p class="price-big">₹${formatPrice(a.price)} <span style="font-size:1rem;color:var(--muted)">per person</span></p>
                <p class="card-rating">★ ${a.averageRating} · ${a.reviewCount} reviews</p>
                <p style="margin-top:1rem">${escapeHtml(a.description)}</p>
                <div class="detail-actions">
                    <a href="/reviews.html?id=${a.id}" class="btn btn-outline"
                       onclick="sessionStorage.removeItem('checkoutDeadlineMs')">Read reviews</a>
                    <a href="/checkout.html?id=${a.id}" class="btn btn-primary" id="btn-book"
                       onclick="sessionStorage.removeItem('checkoutDeadlineMs')">Book now</a>
                </div>
            </div>
        </div>`;
}
load().catch(e => document.getElementById('content').innerHTML = `<p class="error-msg">${e.message}</p>`);
</script>
</body>
</html>
