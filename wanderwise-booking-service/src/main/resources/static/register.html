<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up — WanderWise</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<header class="header" id="site-header"></header>
<main class="container">
    <div class="auth-card">
        <h1>Create account</h1>
        <p class="hint">Create a free account to book tours and manage your trips.</p>
        <form id="reg-form">
            <div class="form-group">
                <label>Full name</label>
                <input type="text" id="name" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="tel" id="phone">
            </div>
            <div class="form-group">
                <label>Password (min 6 chars)</label>
                <input type="password" id="password" minlength="6" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Sign up</button>
            <p id="err" class="error-msg hidden"></p>
        </form>
        <p style="margin-top:1.25rem;text-align:center" class="muted">
            Already have an account? <a href="/login.html">Log in</a>
        </p>
    </div>
</main>
<footer class="footer" id="site-footer"></footer>
<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script>
document.getElementById('reg-form').onsubmit = async e => {
    e.preventDefault();
    const err = document.getElementById('err');
    err.classList.add('hidden');
    try {
        await api('/auth/register', {
            method: 'POST',
            body: JSON.stringify({
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                password: document.getElementById('password').value
            })
        });
        location.href = '/';
    } catch (ex) {
        err.textContent = ex.message;
        err.classList.remove('hidden');
    }
};
</script>
</body>
</html>
