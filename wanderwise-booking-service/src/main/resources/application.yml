spring:
  application:
    name: wanderwise-booking-service
  profiles:
    active: h2
  threads:
    virtual:
      enabled: false

server:
  port: 8080

app:
  base-url: http://localhost:8080

wanderwise:
  catalog:
    base-url: http://localhost:8081
  internal-secret: wanderwise-internal

booking:
  payment-timeout-minutes: 30

scheduler:
  reconciliation-cron: "0 */15 * * * *"

stripe:
  enabled: false
  api-key: ${STRIPE_API_KEY:sk_test_placeholder}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
