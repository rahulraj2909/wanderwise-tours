# Cloud demo profile (e.g. Render.com): in-memory H2, no Redis, no scheduled ingestion.
server:
  port: ${PORT:8081}
  forward-headers-strategy: framework

spring:
  datasource:
    url: jdbc:h2:mem:catalog;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update
  cache:
    type: simple
    cache-names: attractions, attractionDetail, cities, categories
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

wanderwise:
  booking:
    base-url: ${WANDERWISE_BOOKING_BASE_URL:http://localhost:8080}

ingestion:
  scheduled:
    enabled: false
